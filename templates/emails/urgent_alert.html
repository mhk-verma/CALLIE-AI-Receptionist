<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .alert { background-color: #fee2e2; border-left: 4px solid #ef4444; padding: 15px; margin-bottom: 20px; }
        .button { display: inline-block; padding: 10px 20px; background-color: #7c3aed; color: white; text-decoration: none; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="color: #dc2626;">⚠️ URGENT ALERT</h1>
        
        <div class="alert">
            <h2>{{ business_name }}</h2>
            <p><strong>Urgency Level:</strong> {{ urgency_level|upper }}</p>
            <p><strong>Reason:</strong> {{ reason }}</p>
            <p><strong>Conversation ID:</strong> {{ conversation_id }}</p>
        </div>
        
        <p>Please check your dashboard for more details and take appropriate action immediately.</p>
        
        <p>
            <a href="#" class="button">View Dashboard</a>
        </p>
        
        <hr>
        <p style="font-size: 12px; color: #666;">
            This is an automated message from AI Receptionist.
        </p>
    </div>
</body>
</html>
