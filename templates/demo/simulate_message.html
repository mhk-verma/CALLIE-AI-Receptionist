{% extends 'base.html' %}

{% block title %}Simulate Message - AI Receptionist{% endblock %}

{% block content %}
<div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="mb-6">
        <a href="{% url 'demo:home' %}" class="text-purple-600 hover:text-purple-800">
            <i class="fas fa-arrow-left mr-2"></i> Back to Demo
        </a>
    </div>
    
    <div class="bg-white rounded-lg shadow">
        <div class="px-6 py-4 border-b border-gray-200">
            <h2 class="text-xl font-semibold">Message Simulation</h2>
            <p class="text-sm text-gray-500">Test the message handling system</p>
        </div>
        
        <div class="p-6">
            <form id="messageForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Channel
                    </label>
                    <select name="channel" class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500">
                        {% for value, label in channels %}
                        <option value="{{ value }}">{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Sender Name
                    </label>
                    <input 
                        type="text" 
                        name="sender_name" 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        value="Demo Customer"
                    >
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Message
                    </label>
                    <textarea 
                        name="message" 
                        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-purple-500"
                        rows="4"
                        placeholder="Type your message..."
                        required
                    ></textarea>
                </div>
                
                <button 
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 transition duration-300"
                >
                    <i class="fas fa-paper-plane mr-2"></i> Send Message
                </button>
            </form>
            
            <!-- Response Area -->
            <div id="responseArea" class="mt-6 hidden">
                <div class="bg-gray-50 rounded-lg p-6">
                    <h3 class="font-semibold mb-4">AI Response</h3>
                    <div id="aiResponse" class="text-gray-700"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.getElementById('messageForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    
    const formData = new FormData(this);
    const data = {
        channel: formData.get('channel'),
        sender_name: formData.get('sender_name'),
        message: formData.get('message')
    };
    
    try {
        const response = await fetch('{% url "demo:simulate_message" %}', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify(data)
        });
        
        const result = await response.json();
        
        document.getElementById('responseArea').classList.remove('hidden');
        document.getElementById('aiResponse').textContent = result.response;
    } catch (error) {
        console.error('Error:', error);
        alert('Error sending message. Please try again.');
    }
});

function getCookie(name) {
    const value = `; ${document.cookie}`;
    const parts = value.split(`; ${name}=`);
    if (parts.length === 2) return parts.pop().split(';').shift();
}
</script>
{% endblock %}
