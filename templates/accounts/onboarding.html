<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Your Business - CALLIE</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Design System -->
    <link rel="stylesheet" href="/static/css/design-system.css">
</head>
<body>
    <div class="auth-container">
        <div class="max-w-4xl mx-auto py-8">
            <!-- Progress Steps -->
            <div class="flex items-center justify-between mb-8">
                <div class="flex items-center flex-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary font-semibold text-sm">1</div>
                    <div class="flex-1 h-1 mx-4 bg-border"></div>
                </div>
                <div class="flex items-center flex-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary font-semibold text-sm">2</div>
                    <div class="flex-1 h-1 mx-4 bg-border"></div>
                </div>
                <div class="flex items-center flex-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary font-semibold text-sm">3</div>
                    <div class="flex-1 h-1 mx-4 bg-border"></div>
                </div>
                <div class="flex items-center flex-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary font-semibold text-sm">4</div>
                    <div class="flex-1 h-1 mx-4 bg-border"></div>
                </div>
                <div class="flex items-center flex-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary font-semibold text-sm">5</div>
                    <div class="flex-1 h-1 mx-4 bg-border"></div>
                </div>
                <div class="flex items-center flex-1">
                    <div class="flex items-center justify-center w-10 h-10 rounded-full bg-primary font-semibold text-sm">6</div>
                </div>
            </div>
            
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Setup Complete</h2>
                    <p class="text-sm text-muted mt-1">Your business is ready to use Callie</p>
                </div>
                
                <div class="card-body">
                    <div class="text-center py-8">
                        <div class="ai-orb mx-auto mb-6" style="width: 80px; height: 80px;">
                            <i data-lucide="sparkles" style="width: 40px; height: 40px; color: white;"></i>
                        </div>
                        
                        <h2 class="text-2xl font-bold mb-2">✓ Callie is ready</h2>
                        <p class="text-muted mb-8">Your AI receptionist is configured successfully and ready to handle customer communications.</p>
                        
                        <div class="flex justify-center gap-4">
                            <a href="{% url 'demo:home' %}" class="btn btn-primary">
                                <i data-lucide="play" style="width: 16px; height: 16px;"></i>
                                Try Live Demo
                            </a>
                            <a href="{% url 'dashboard:home' %}" class="btn btn-secondary">
                                <i data-lucide="layout-dashboard" style="width: 16px; height: 16px;"></i>
                                Go to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
