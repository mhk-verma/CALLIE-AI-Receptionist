<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - CALLIE</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Design System -->
    <link rel="stylesheet" href="/static/css/design-system.css">
    
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: -20%;
            right: -10%;
            width: 600px;
            height: 600px;
            background: var(--gradient-primary);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.1;
            animation: float 20s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-30px, 30px); }
        }
        
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-xl);
            padding: 2rem;
            position: relative;
            z-index: 1;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-icon {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--gradient-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
        }
        
        .auth-icon i {
            color: var(--color-primary);
        }
        
        .auth-title {
            font-size: 24px;
            font-weight: 700;
            color: var(--color-text);
            margin-bottom: 0.5rem;
        }
        
        .auth-subtitle {
            font-size: 14px;
            color: var(--color-text-muted);
            line-height: 1.6;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 13px;
            font-weight: 500;
            color: var(--color-text);
        }
        
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            font-size: 14px;
            color: var(--color-text);
            background: var(--color-background);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-md);
            transition: border-color var(--transition-fast);
        }
        
        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .form-group input::placeholder {
            color: var(--color-text-muted);
        }
        
        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 14px;
            color: var(--color-text-muted);
        }
        
        .auth-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 500;
        }
        
        .auth-footer a:hover {
            color: var(--color-primary-hover);
        }
        
        @media (max-width: 480px) {
            .auth-card {
                padding: 1.5rem;
            }
            
            .auth-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-icon">
                    <i data-lucide="lock" style="width: 32px; height: 32px;"></i>
                </div>
                <h1 class="auth-title">Set new password</h1>
                <p class="auth-subtitle">Create a strong password for your account.</p>
            </div>
            
            <form method="post" class="auth-form">
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="id_new_password">New Password</label>
                    <input 
                        type="password" 
                        name="new_password" 
                        id="id_new_password" 
                        placeholder="••••••••"
                        required
                        autofocus
                    >
                </div>
                
                <div class="form-group">
                    <label for="id_confirm_password">Confirm New Password</label>
                    <input 
                        type="password" 
                        name="confirm_password" 
                        id="id_confirm_password" 
                        placeholder="••••••••"
                        required
                    >
                </div>
                
                <button type="submit" class="btn btn-primary btn-lg">
                    Reset Password
                </button>
            </form>
            
            <div class="auth-footer">
                <a href="{% url 'accounts:login' %}">
                    <i data-lucide="arrow-left" style="width: 14px; height: 14px; display: inline;"></i>
                    Back to login
                </a>
            </div>
        </div>
    </div>
    
    <script>
        lucide.createIcons();
        
        // Password confirmation
        const password = document.getElementById('id_new_password');
        const confirmPassword = document.getElementById('id_confirm_password');
        
        if (confirmPassword) {
            confirmPassword.addEventListener('input', function() {
                if (this.value !== password.value) {
                    this.setCustomValidity('Passwords do not match');
                } else {
                    this.setCustomValidity('');
                }
            });
        }
    </script>
</body>
</html>
