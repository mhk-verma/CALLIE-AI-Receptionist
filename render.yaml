services:
  - type: web
    name: callie-ai-receptionist
    env: python
    buildCommand: pip install -r requirements.txt && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: callie-db
          property: connectionString
      - key: DEMO_MODE
        value: True
      - key: AI_PROVIDER
        value: demo
      - key: ALLOWED_HOSTS
        value: .onrender.com

databases:
  - name: callie-db
    databaseName: callie
    user: callie_user
